<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>

  <meta http-equiv="refresh" content="0; url=https://gist.github.com/akshay-abraham/e810e05b14792a410bf8a9183467e43e">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --card: #13171c;
      --text: #f5f7fa;
      --muted: #98a2b3;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 10px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: .95rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    const url = "https://gist.github.com/akshay-abraham/e810e05b14792a410bf8a9183467e43e";
    window.location.replace(url);
  </script>
</head>
<body>
  <main class="card">
    <div class="spinner"></div>
    <h1>Redirecting…</h1>
    <p>
      If you aren't redirected automatically,
      <a href="https://gist.github.com/akshay-abraham/e810e05b14792a410bf8a9183467e43e">click here</a>.
    </p>
  </main>
</body>
</html>
